# EXAMPLE - do not commit a filled-in copy.
#
# EFP_HOST_API_TOKEN is the one secret shared by the Portal and the app host
# (docs/CONTRACTS.md, section 1). The Portal must be given the same value as
# APPS_HOST_API_TOKEN. Make one with:
#
#     python3 -c "import secrets; print(secrets.token_urlsafe(48))"
#
# PIP_INDEX_URL is only needed when the private package index wants
# credentials; without them put the plain URL into the Deployment instead.
apiVersion: v1
kind: Secret
metadata:
  name: efp-app-host
  namespace: efp-apps
type: Opaque
stringData:
  EFP_HOST_API_TOKEN: "replace-with-a-long-random-value"
  PIP_INDEX_URL: "https://user:password@nexus.example.com/repository/pypi/simple"
