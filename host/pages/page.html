<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
{{refresh_html}}
<title>{{title}}</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f4f5f7;
  --card: #ffffff;
  --text: #1b1f24;
  --muted: #5a6370;
  --line: #dde1e6;
  --accent: #1f5fd0;
  --accent-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #14161a;
    --card: #1d2025;
    --text: #e8ebf0;
    --muted: #9aa3af;
    --line: #2f343c;
    --accent: #7aa2ff;
    --accent-text: #10131a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--page);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "PingFang HK", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", sans-serif;
}
main {
  width: 100%;
  max-width: 520px;
  padding: 32px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.product {
  margin: 0 0 20px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
h1 {
  margin: 0 0 12px;
  font-size: 22px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}
p { margin: 0 0 12px; overflow-wrap: anywhere; }
.message { color: var(--muted); }
.detail {
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  white-space: pre-wrap;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 0; }
.button {
  display: inline-block;
  padding: 8px 16px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  text-decoration: none;
}
.button.quiet { background: transparent; color: var(--accent); }
.progress { display: none; height: 4px; margin: 20px 0 0; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress::before {
  content: "";
  display: block;
  width: 40%;
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  animation: slide 1.2s ease-in-out infinite;
}
.page-starting .progress { display: block; }
@keyframes slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(250%); }
}
@media (prefers-reduced-motion: reduce) {
  .progress::before { animation: none; width: 100%; opacity: 0.5; }
}
</style>
</head>
<body class="page-{{page}}">
<main>
<p class="product">{{product}}</p>
<h1>{{heading}}</h1>
<p class="message">{{message}}</p>
{{detail_html}}
<div class="progress" aria-hidden="true"></div>
{{actions_html}}
</main>
</body>
</html>
