<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f4f5f7;
  --card: #ffffff;
  --text: #1b1f24;
  --muted: #5a6370;
  --line: #dde1e6;
  --accent: #1f5fd0;
  --accent-text: #ffffff;
  --badge: #e7eefc;
  --badge-text: #1b4aa3;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
  --lift: 0 6px 18px rgba(16, 24, 40, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #14161a;
    --card: #1d2025;
    --text: #e8ebf0;
    --muted: #9aa3af;
    --line: #2f343c;
    --accent: #7aa2ff;
    --accent-text: #10131a;
    --badge: #253354;
    --badge-text: #b9ccff;
    --shadow: none;
    --lift: 0 6px 18px rgba(0, 0, 0, 0.45);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--page);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "PingFang HK", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", sans-serif;
}
a { color: var(--accent); }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  padding: 14px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.product {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.account {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 18px;
  margin-left: auto;
  font-size: 14px;
}
.account .who { color: var(--muted); overflow-wrap: anywhere; }
.account a { text-decoration: none; }
.account a:hover, .account a:focus-visible { text-decoration: underline; }
main { max-width: 1160px; margin: 0 auto; padding: 32px 24px 56px; }
h1 { margin: 0 0 20px; font-size: 26px; line-height: 1.25; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 0 0 24px; }
.tools[hidden] { display: none; }
.tools input {
  flex: 1 1 260px;
  max-width: 440px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  font: inherit;
}
.tools input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.count { color: var(--muted); font-size: 14px; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.cards li { display: flex; min-width: 0; }
.cards li[hidden] { display: none; }
.card {
  display: flex;
  flex: 1;
  gap: 14px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  color: inherit;
  text-decoration: none;
  transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
}
.card:hover, .card:focus-visible { border-color: var(--accent); box-shadow: var(--lift); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon {
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  border-radius: 11px;
  object-fit: cover;
  background: var(--page);
}
.icon.letter {
  display: flex;
  align-items: center;
  justify-content: center;
  background: hsl(var(--hue) 52% 44%);
  color: #ffffff;
  font-size: 22px;
  font-weight: 700;
}
.text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.name { font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.description {
  display: -webkit-box;
  overflow: hidden;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px; color: var(--muted); font-size: 13px; }
.meta:empty { display: none; }
.badge { padding: 1px 8px; border-radius: 999px; background: var(--badge); color: var(--badge-text); font-weight: 600; }
.empty, .none {
  margin: 8px 0 0;
  padding: 40px 24px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  color: var(--muted);
  text-align: center;
}
.empty h2 { margin: 0 0 8px; color: var(--text); font-size: 20px; }
.empty p, .none p { margin: 0; }
.none[hidden] { display: none; }
.actions { margin: 20px 0 0 !important; }
.button {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  text-decoration: none;
}
@media (max-width: 520px) {
  .bar { padding: 12px 16px; }
  main { padding: 24px 16px 40px; }
  h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover, .card:focus-visible { transform: none; }
}
</style>
</head>
<body>
<header class="bar">
<p class="product">{{product}}</p>
<nav class="account"><span class="who">{{who}}</span>{{portal_link}}<a href="/_efp/logout">{{sign_out}}</a></nav>
</header>
<main>
<h1>{{heading}}</h1>
<div class="tools"{{tools_hidden}}>
<input id="q" type="search" placeholder="{{search}}" aria-label="{{search}}" autocomplete="off" spellcheck="false">
<span class="count">{{count}}</span>
</div>
<ul class="cards">{{cards_html}}</ul>
{{empty_html}}
<div class="none" id="none" hidden><p>{{no_match}}</p></div>
</main>
<script nonce="{{nonce}}">
(function () {
  var input = document.getElementById("q");
  var none = document.getElementById("none");
  var cards = Array.prototype.slice.call(document.querySelectorAll(".card"));
  if (!input || !cards.length) return;
  function apply() {
    var words = input.value.toLowerCase().split(/\s+/).filter(Boolean);
    var shown = 0;
    cards.forEach(function (card) {
      var text = card.getAttribute("data-search") || "";
      var match = words.every(function (word) { return text.indexOf(word) >= 0; });
      card.parentNode.hidden = !match;
      if (match) shown += 1;
    });
    none.hidden = shown > 0;
  }
  input.addEventListener("input", apply);
  document.addEventListener("keydown", function (event) {
    if (event.key === "/" && document.activeElement !== input && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault();
      input.focus();
    }
  });
  apply();
})();
</script>
</body>
</html>
