[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efp-app-host"
version = "0.1.0"
description = "Runs every EFP member app in one container: gateway, manager and process supervision."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "supervisor>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
efp-app-host = "efp_app_host.app:main"

[tool.setuptools.packages.find]
include = ["efp_app_host*"]

[tool.setuptools.package-data]
efp_app_host = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
