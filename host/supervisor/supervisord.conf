; supervisord of the app host: nginx (the gateway), the manager, and one
; program per app.
;
; The programs of the apps are not listed here. The manager writes one file
; per app into %(ENV_EFP_HOST_RUN_DIR)s/supervisor.d and tells supervisord
; over the socket below to load it. An app's program never starts or restarts
; by itself (autostart=false, autorestart=false): the manager decides.
;
; EFP_HOST_RUN_DIR is exported by bin/entrypoint.sh.

[unix_http_server]
file=%(ENV_EFP_HOST_RUN_DIR)s/supervisor.sock
chmod=0700
chown=root:root

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=%(ENV_EFP_HOST_RUN_DIR)s/supervisord.pid
; App output goes to each app's own log file, never to a child log here.
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_EFP_HOST_RUN_DIR)s/supervisor.sock

; The manager: the admin API for the Portal and the gateway's access checks.
[program:manager]
command=/usr/local/bin/python3 -m efp_app_host
directory=/
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=1000000
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; The gateway. Started after the manager; until the manager answers, nginx
; answers 502 to app requests and 200 to /_efp/health.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
directory=/
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=1000000
stopsignal=QUIT
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[include]
files = %(ENV_EFP_HOST_RUN_DIR)s/supervisor.d/*.conf
