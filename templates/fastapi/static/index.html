<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My EFP app</title>
  <!-- Relative URLs only: the app is served under /{slug}/ once deployed. -->
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main>
    <h1>My EFP app</h1>
    <p id="who" class="muted">Checking who you are...</p>

    <section>
      <h2>Ask the model</h2>
      <form id="ask-form">
        <textarea id="question" rows="3" placeholder="Ask something" required></textarea>
        <button type="submit" id="ask-button">Ask</button>
      </form>
      <pre id="answer" aria-live="polite"></pre>
    </section>

    <section>
      <h2>Your note</h2>
      <form id="note-form">
        <textarea id="note" rows="4" placeholder="Kept on the server across restarts and deployments"></textarea>
        <button type="submit">Save</button>
        <span id="note-status" class="muted" role="status"></span>
      </form>
    </section>
  </main>
  <script src="static/app.js"></script>
</body>
</html>
