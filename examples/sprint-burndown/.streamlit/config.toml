# The look of the EFP kit (docs/UI_KIT.md) in Streamlit's own theme: its blue,
# its greys, its rounded corners and its chart colours, in light and in dark.
# The burndown, the status bars and the load per assignee take their colours
# from chartCategoricalColors. Nothing sets "base", so the page follows the
# visitor's system and the settings menu can switch. The colours are the
# kit's, written as hex because Streamlit does not read oklch(). An older
# Streamlit that does not know [theme.light] and [theme.dark] keeps [theme].
#
# Leave server.baseUrlPath and the CORS and XSRF settings out of this file:
# the host passes them on the command line.
[theme]
primaryColor = "#2f5fe0"
font = "sans serif"
baseRadius = "0.625rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2f5fe0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#1c212e"
borderColor = "#e1e5ec"
linkColor = "#2a60e9"
chartCategoricalColors = ["#2a60e9", "#9249eb", "#00bfbb", "#069ce4", "#00a768", "#f5af20", "#ea3b48"]

[theme.dark]
primaryColor = "#699aff"
backgroundColor = "#161a22"
secondaryBackgroundColor = "#222834"
textColor = "#e4e8f0"
borderColor = "#2f3644"
linkColor = "#699aff"
chartCategoricalColors = ["#699aff", "#b688fe", "#2dd8d3", "#52b5f4", "#40c786", "#fcba43", "#fa686a"]
