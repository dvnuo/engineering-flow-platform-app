<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build health</title>
  <!-- Relative URLs only: the app is served under /{slug}/ once deployed. -->
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main>
    <h1>Build health</h1>
    <p class="lede">The last 30 builds of each job. Jenkins is read with the app owner's connector, and what it says is kept for five minutes.</p>

    <div class="toolbar">
      <p id="status" role="status">Asking Jenkins...</p>
      <button type="button" id="refresh" disabled>Refresh</button>
    </div>

    <dl id="tiles" class="tiles" hidden></dl>

    <section id="board" class="card" aria-label="Jobs" hidden>
      <ul id="legend" class="legend" aria-label="What the squares mean"></ul>
      <table id="jobs">
        <thead>
          <tr>
            <th scope="col">Job</th>
            <th scope="col">Last 30 builds, oldest to newest</th>
            <th scope="col" class="number">Success</th>
            <th scope="col">Median duration</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <p id="empty" class="empty" hidden>No job is listed yet. Add your jobs to jobs.json and deploy again.</p>
  </main>
  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="static/app.js"></script>
</body>
</html>
